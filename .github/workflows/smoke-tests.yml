name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke-tests:
    # UI baselines are currently committed for darwin-arm64.
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: moonbit-community/setup-moonbit@main
        with:
          version: ${{ matrix.toolchain }}

      - name: Install Node dependencies
        run: npm install

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Validate MoonBit bindings
        run: |
          moon check --target js --deny-warn
          moon build --target js --deny-warn
          moon info --target js \
            . \
            authentication \
            chat \
            commands \
            comments \
            debug \
            env \
            extensions \
            internal/v \
            internal/v/providers \
            l10n \
            languages \
            lm \
            notebooks \
            scm \
            tasks \
            tests \
            window \
            workspace
          git diff --exit-code -- pkg.generated.mbti

      - name: Check smoke extension
        run: npm run check:test-extension:smoke

      - name: Run smoke tests
        run: npm run test:smoke
