name: Smoke Tests

on:
  workflow_dispatch:

jobs:
  smoke-tests:
    # UI baselines are currently committed for darwin-arm64.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm install

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Validate MoonBit bindings
        run: |
          moon check --target js
          moon build --target js
          moon info --target js \
            . \
            authentication \
            chat \
            commands \
            comments \
            debug \
            env \
            extensions \
            internal/v \
            internal/v/providers \
            l10n \
            languages \
            lm \
            notebooks \
            scm \
            tasks \
            tests \
            window \
            workspace
          git diff --exit-code -- pkg.generated.mbti

      - name: Check smoke extension
        run: npm run check:test-extension:smoke

      - name: Run smoke tests
        run: npm run test:smoke
